version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: app_backend_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: securepassword
      MYSQL_DATABASE: app_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  api:
    build: ./backend
    container_name: app_api_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: securepassword
      DB_NAME: app_db
    depends_on:
      - database
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: app_frontend_web
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge