<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Tier App Frontend</title>
  <style>body { font-family: Arial, sans-serif; margin: 40px; }</style>
</head>
<body>
  <h1>Multi-Tier App Frontend</h1>
  <p>Welcome! This is the frontend service.</p>
  <p>It calls the API at <code>/api/status</code>.</p>
  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('status').textContent = JSON.stringify(data);
      } catch (err) {
        document.getElementById('status').textContent = 'Unable to reach API';
      }
    }
    fetchStatus();
  </script>
  <pre id="status">Loading...</pre>
</body>
</html>
